<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>인형 놀이 목욕 & 드레스업 게임</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Jua&display=swap');
        
        body { 
            font-family: 'Jua', sans-serif; 
            background: linear-gradient(135deg, #f0f8ff, #ffe4e1); 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center;
            min-height: 100vh;
            margin: 0; 
            padding: 10px; 
            box-sizing: border-box;
            touch-action: none;
            user-select: none;
        }
        #game-container { 
            background: white; 
            width: 100%;
            max-width: 380px; 
            height: 640px; 
            border-radius: 30px; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.15); 
            overflow: hidden; 
            position: relative; 
            display: flex; 
            flex-direction: column; 
            border: 4px solid #fff;
        }
        #progress-header {
            background: #fff0f5;
            padding: 10px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px dashed #ffb6c1;
            font-size: 14px;
            color: #d66d87;
            box-sizing: border-box;
        }
        .progress-bar-container {
            flex: 1;
            height: 10px;
            background: #eee;
            border-radius: 5px;
            margin-left: 10px;
            overflow: hidden;
        }
        #progress-fill {
            width: 0%;
            height: 100%;
            background: linear-gradient(to right, #ff69b4, #ff1493);
            transition: width 0.3s ease;
        }

        #message { 
            position: relative; 
            margin: 8px auto 0 auto; 
            width: 90%; 
            background: rgba(255,255,255,0.95); 
            padding: 8px 12px; 
            border-radius: 12px; 
            text-align: center; 
            font-size: 14px; 
            font-weight: bold; 
            color: #d66d87; 
            box-shadow: 0 3px 8px rgba(0,0,0,0.06);
            border: 2px solid #ffb6c1;
            z-index: 10;
            box-sizing: border-box;
        }

        /* 문지르기 게이지바 스타일 */
        #scrub-gauge-box {
            width: 80%;
            height: 14px;
            background: #f0f0f0;
            border-radius: 7px;
            margin: 8px auto 0 auto;
            overflow: hidden;
            border: 1px solid #ccc;
            display: none;
        }
        #scrub-fill {
            width: 0%;
            height: 100%;
            background: linear-gradient(to right, #00c9ff, #92fe9d);
            transition: width 0.1s ease;
        }

        #screen { 
            flex: 1; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            position: relative; 
            background: radial-gradient(circle at center, #ffffff 0%, #f7f9fc 100%);
            cursor: pointer;
        }

        #character { 
            width: 140px; 
            height: 280px; 
            position: relative; 
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: transform 0.1s ease;
        }
        #character.rubbing {
            transform: scale(1.02) rotate(1deg);
        }
        #character.glowing { 
            filter: drop-shadow(0 0 20px #ffd700);
        }

        #head {
            width: 110px;
            height: 110px;
            background: #ffe4e1;
            border-radius: 50%;
            position: relative;
            border: 3px solid #ffb6c1;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            z-index: 2;
        }
        .eyes { position: absolute; top: 38px; width: 100%; display: flex; justify-content: space-around; padding: 0 22px; box-sizing: border-box; }
        .eye { width: 14px; height: 14px; background: #333; border-radius: 50%; position: relative; }
        .eye::after { content: ''; position: absolute; top: 2px; right: 2px; width: 4px; height: 4px; background: white; border-radius: 50%; }
        
        .blush { position: absolute; top: 60px; width: 100%; display: flex; justify-content: space-between; padding: 0 16px; box-sizing: border-box; opacity: 0.6; }
        .cheek { width: 15px; height: 8px; background: #ff9999; border-radius: 50%; }

        #torso {
            width: 90px;
            height: 120px;
            background: #ffe4e1;
            border-radius: 20px 20px 35px 35px;
            position: relative;
            margin-top: -10px;
            border: 3px solid #ffb6c1;
            z-index: 1;
            display: flex;
            justify-content: center;
        }

        .bubble-effect {
            position: absolute;
            font-size: 24px;
            pointer-events: none;
            animation: floatUp 0.6s ease-out forwards;
            z-index: 6;
        }
        @keyframes floatUp {
            0% { transform: translateY(0) scale(0.5); opacity: 1; }
            100% { transform: translateY(-40px) scale(1.2); opacity: 0; }
        }

        .clothes-item { 
            position: absolute; 
            top: 95px; 
            width: 130px; 
            height: 150px; 
            display: none; 
            pointer-events: none; 
            text-align: center; 
            font-size: 90px; 
            z-index: 5;
            animation: dropOn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }
        @keyframes dropOn {
            0% { transform: translateY(-50px) scale(0.6); opacity: 0; }
            100% { transform: translateY(0) scale(1); opacity: 1; }
        }

        #ui { 
            background: #fafafa; 
            padding: 12px; 
            display: grid; 
            grid-template-columns: repeat(3, 1fr); 
            gap: 8px; 
            border-top: 2px solid #eee; 
        }
        button { 
            padding: 10px 4px; 
            font-size: 13px; 
            font-family: 'Jua', sans-serif;
            cursor: pointer; 
            border: none; 
            border-radius: 14px; 
            background: #e0f0ff; 
            color: #444;
            transition: all 0.2s; 
            box-shadow: 0 4px 0 #c2e0ff;
        }
        button:hover { background: #b3d9ff; transform: translateY(-2px); }
        button:active { transform: translateY(2px); box-shadow: 0 1px 0 #c2e0ff; }
        button:disabled { background: #ddd; color: #888; box-shadow: none; cursor: default; transform: none; }

        /* 옷장 모달 */
        #closet { 
            display: none; 
            position: fixed; 
            top: 50%; left: 50%; 
            transform: translate(-50%, -50%); 
            background: white; 
            padding: 25px; 
            border-radius: 25px; 
            border: 3px solid #ff69b4; 
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            z-index: 100; 
            text-align: center;
            width: 280px;
        }
        #closet h3 { margin-top: 0; color: #ff1493; }
        .closet-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 15px; }
        .closet-grid button { background: #ffe4e1; box-shadow: 0 4px 0 #ffb6c1; color: #d66d87; font-size: 15px; padding: 12px; }
    </style>
</head>
<body>

<div id="game-container">
    <div id="progress-header">
        <span id="step-title">목욕 단계 1/6</span>
        <div class="progress-bar-container"><div id="progress-fill"></div></div>
    </div>
    <div id="message">버튼을 누르고 캐릭터를 **문질러서** 씻겨주세요!</div>
    <div id="scrub-gauge-box"><div id="scrub-fill"></div></div>
    
    <div id="screen" id="screen-area">
        <div id="character">
            <div id="head">
                <div class="blush"><div class="cheek"></div><div class="cheek"></div></div>
                <div class="eyes"><div class="eye"></div><div class="eye"></div></div>
            </div>
            <div id="torso"></div>
        </div>
        <div id="item-panties" class="clothes-item">🩲</div>
        <div id="item-top" class="clothes-item">👚</div>
        <div id="item-bottom" class="clothes-item">👖</div>
        <div id="item-dress" class="clothes-item">👗</div>
        <div id="item-pajamas" class="clothes-item">👘</div>
    </div>
    
    <div id="ui">
        <button id="btn-soap" onclick="startStep('soap', '🧼 비누칠을 시작해요! 캐릭터를 문질러 거품을 내세요!')">🧼 비누칠</button>
        <button id="btn-water" onclick="startStep('water', '🚿 샤워기로 거품을 싹 씻어내세요!')" disabled>🚿 물 헹굼</button>
        <button id="btn-towel" onclick="startStep('towel', '🧺 수건으로 토닥토닥 물기를 닦아주세요!')" disabled>🧺 수건 톡톡</button>
        <button id="btn-lotion" onclick="startStep('lotion', '🧴 로션을 문질러 부드럽게 발라주세요!')" disabled>🧴 보습 로션</button>
        <button id="btn-hair" onclick="startStep('hair', '💨 드라이기로 머리를 슥슥 말려주세요!')" disabled>💨 머리 말리기</button>
        <button id="btn-glow" onclick="stepGlow()" disabled>⭐ 반짝 반짝</button>
        <button id="btn-closet" onclick="showCloset()" disabled>👗 옷 입히기</button>
        <button onclick="resetGame()" style="background:#eee; box-shadow:0 4px 0 #ddd; color:#666;">🔄 처음부터</button>
    </div>
</div>

<div id="closet">
    <h3>어떤 옷을 입을까?</h3>
    <div class="closet-grid">
        <button onclick="putOn('panties')">🩲 팬티</button>
        <button onclick="putOn('top')">👚 상의</button>
        <button onclick="putOn('bottom')">👖 바지</button>
        <button onclick="putOn('dress')">👗 드레스</button>
        <button onclick="putOn('pajamas')">👘 잠옷</button>
    </div>
    <button onclick="finishGame()" style="width:100%; background:linear-gradient(to right, #ff69b4, #ff1493); color:white; box-shadow:0 4px 0 #c71585;">지퍼 쫙! 완성 완료! 🎉</button>
</div>

<script>
    const msg = document.getElementById('message');
    const char = document.getElementById('character');
    const progressFill = document.getElementById('progress-fill');
    const stepTitle = document.getElementById('step-title');
    const scrubGaugeBox = document.getElementById('scrub-gauge-box');
    const scrubFill = document.getElementById('scrub-fill');
    
    let currentStep = 1;
    const totalSteps = 6;
    let activeStep = null; // 'soap', 'water', 'towel', 'lotion', 'hair'
    let scrubProgress = 0;
    let isInteracting = false;

    function updateProgress(step, title) {
        currentStep = step;
        stepTitle.innerText = `목욕 단계 ${step}/${totalSteps}`;
        progressFill.style.width = `${(step / totalSteps) * 100}%`;
    }

    function playSound(freq = 587.33) {
        try {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(freq * 1.5, ctx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.08, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.1);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start();
            osc.stop(ctx.currentTime + 0.1);
        } catch(e) {}
    }

    function startStep(stepName, instructionText) {
        activeStep = stepName;
        scrubProgress = 0;
        scrubFill.style.width = '0%';
        scrubGaugeBox.style.display = 'block';
        msg.innerText = instructionText;
        playSound(440);
    }

    // 문지르기(스크럽) 인터랙션 로직
    const screenArea = document.getElementById('screen');

    function handleInteractionMove(e) {
        if (!activeStep) return;
        
        // 문지를 때마다 게이지 상승 (총 15번 문지르면 100%)
        scrubProgress += 7;
        if (scrubProgress > 100) scrubProgress = 100;
        scrubFill.style.width = scrubProgress + '%';

        // 시각적 효과 (캐릭터 흔들림 및 거품/효과 생성)
        char.classList.add('rubbing');
        setTimeout(() => char.classList.remove('rubbing'), 100);

        // 마우스/터치 위치에 이펙트 생성
        const clientX = e.clientX || (e.touches ? e.touches[0].clientX : 0);
        const clientY = e.clientY || (e.touches ? e.touches[0].clientY : 0);
        if (clientX && clientY) {
            createEffectParticle(clientX, clientY);
        }

        if (scrubProgress >= 100) {
            completeActiveStep();
        }
    }

    screenArea.addEventListener('mousemove', (e) => {
        if (isInteracting) handleInteractionMove(e);
    });
    screenArea.addEventListener('mousedown', () => isInteracting = true);
    window.addEventListener('mouseup', () => isInteracting = false);

    screenArea.addEventListener('touchmove', (e) => {
        if (isInteracting) handleInteractionMove(e.touches[0]);
    }, { passive: true });
    screenArea.addEventListener('touchstart', () => isInteracting = true);
    window.addEventListener('touchend', () => isInteracting = false);

    function createEffectParticle(x, y) {
        const p = document.createElement('div');
        p.className = 'bubble-effect';
        const rect = screenArea.getBoundingClientRect();
        p.style.left = (x - rect.left) + 'px';
        p.style.top = (y - rect.top) + 'px';
        
        if (activeStep === 'soap') p.innerText = '🫧';
        else if (activeStep === 'water') p.innerText = '💦';
        else if (activeStep === 'towel') p.innerText = '✨';
        else if (activeStep === 'lotion') p.innerText = '💧';
        else if (activeStep === 'hair') p.innerText = '💨';

        screenArea.appendChild(p);
        setTimeout(() => p.remove(), 600);
    }

    function completeActiveStep() {
        playSound(880);
        scrubGaugeBox.style.display = 'none';
        const step = activeStep;
        activeStep = null;

        if (step === 'soap') {
            msg.innerText = "뽀득뽀득 거품이 가득해요! 이제 물로 헹궈주세요. 🚿";
            document.getElementById('head').style.background = "#ffffff";
            document.getElementById('torso').style.background = "#ffffff";
            updateProgress(1, "비누칠 완료");
            document.getElementById('btn-water').disabled = false;
            document.getElementById('btn-soap').disabled = true;
        } else if (step === 'water') {
            msg.innerText = "깨끗하게 헹궈졌어요! 수건으로 닦아주세요. 🧺";
            document.getElementById('head').style.background = "#e0f0ff";
            document.getElementById('torso').style.background = "#e0f0ff";
            updateProgress(2, "물 헹굼 완료");
            document.getElementById('btn-towel').disabled = false;
            document.getElementById('btn-water').disabled = true;
        } else if (step === 'towel') {
            msg.innerText = "보송보송 닦였어요! 로션을 발라주세요. 🧴";
            document.getElementById('head').style.background = "#fff0f5";
            document.getElementById('torso').style.background = "#fff0f5";
            updateProgress(3, "수건 닦기 완료");
            document.getElementById('btn-lotion').disabled = false;
            document.getElementById('btn-towel').disabled = true;
        } else if (step === 'lotion') {
            msg.innerText = "촉촉해요! 이제 머리를 말려주세요. 💨";
            updateProgress(4, "로션 바르기 완료");
            document.getElementById('btn-hair').disabled = false;
            document.getElementById('btn-lotion').disabled = true;
        } else if (step === 'hair') {
            msg.innerText = "머리가 뽀송하게 말랐어요! 빛내기 버튼을 누르세요. ⭐";
            updateProgress(5, "머리 말리기 완료");
            document.getElementById('btn-glow').disabled = false;
            document.getElementById('btn-hair').disabled = true;
        }
    }

    function stepGlow() {
        playSound(987.77);
        msg.innerText = "반짝반짝 세상에서 제일 예쁘고 빛나는 우리 아이! ⭐";
        char.classList.add('glowing');
        updateProgress(6, "빛내기 완료");
        document.getElementById('btn-closet').disabled = false;
        document.getElementById('btn-glow').disabled = true;
    }

    function showCloset() {
        playSound(659.25);
        document.getElementById('closet').style.display = 'block';
    }

    function putOn(type) {
        playSound(783.99);
        document.querySelectorAll('.clothes-item').forEach(el => el.style.display = 'none');
        const item = document.getElementById('item-' + type);
        if(item) {
            item.style.display = 'block';
            item.style.animation = 'none';
            item.offsetHeight;
            item.style.animation = 'dropOn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) forwards';
        }
        msg.innerText = type === 'panties' ? "귀여운 팬티를 입었어요! 🩲" :
                        type === 'top' ? "예쁜 상의를 입었어요! 👚" :
                        type === 'bottom' ? "멋진 바지를 입었어요! 👖" :
                        type === 'dress' ? "공주님 드레스를 입었어요! 👗" : "포근한 잠옷을 입었어요! 👘";
    }

    function finishGame() {
        playSound(1046.50);
        document.getElementById('closet').style.display = 'none';
        msg.innerText = "지퍼를 쫙~! 목욕도 하고 옷도 다 입었어요! 참 잘했어요! 🎉";
        progressFill.style.width = "100%";
    }

    function resetGame() {
        location.reload();
    }
</script>

</body>
</html>
