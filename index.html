<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>인형 놀이 목욕 게임</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="game-container">
    <div id="message">안녕! 우리 같이 깨끗하게 씻고 옷 입을까?</div>
    <div id="score-display">점수: <span id="score">0</span></div>
    <div id="screen">
        <div id="character">
            <div class="eyes"><div class="eye"></div><div class="eye"></div></div>
        </div>
        <div id="item-panties" class="clothes-item">🩲</div>
        <div id="item-top" class="clothes-item">👕</div>
        <div id="item-bottom" class="clothes-item">👖</div>
        <div id="item-dress" class="clothes-item">👗</div>
        <div id="item-pajamas" class="clothes-item">✨🌙</div>
    </div>
    
    <div id="ui">
        <button data-action="soap">🧼 비누칠</button>
        <button data-action="water">🚿 물 칙칙</button>
        <button data-action="towel">🧼 수건 톡톡</button>
        <button data-action="lotion">🧴 아빠 로션</button>
        <button data-action="hair">💨 머리 말리기</button>
        <button data-action="glow">⭐ 누가 더 빛나나</button>
        <button data-action="closet">👗 옷 입히기</button>
        <button data-action="reset">🔄 다시 하기</button>
    </div>

    <div id="closet">
        <h3>어떤 옷을 입을까?</h3>
        <button data-action="puton-panties">🩲 팬티</button>
        <button data-action="puton-top">👕 상의</button>
        <button data-action="puton-bottom">👖 하의</button>
        <button data-action="puton-dress">👗 드레스</button>
        <button data-action="puton-pajamas">🌙 잠옷</button>
        <br><br>
        <button data-action="finish">🤐 지퍼 올리기 (끝!)</button>
    </div>

    <div class="game-over-overlay" id="game-over-overlay"></div>
</div>

<script type="module" src="script.js"></script>

</body>
</html>
